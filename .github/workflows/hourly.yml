# Runs the AirSathi data job every hour, for free, on GitHub's computers.
# It needs three repository secrets (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   DATABASE_URL          the Neon connection string (same as on Render)
#   OPENAQ_API_KEY        your OpenAQ key
#   FCM_SERVICE_ACCOUNT   the Firebase service-account JSON (whole file contents), for phone notifications
name: hourly-data-job

on:
  schedule:
    - cron: "7 * * * *"          # every hour at minute 7 (GitHub may start it a few minutes late)
  workflow_dispatch: {}          # also lets you press "Run workflow" by hand

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m airsathi.datajob
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
