# Render blueprint: creates the AirSathi API as a free web service.
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the secret values it asks for.
services:
  - type: web
    name: airsathi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn airsathi.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL        # Neon connection string (postgresql://...)
        sync: false
      - key: JWT_SECRET          # any long random text
        generateValue: true
      - key: ADMIN_EMAILS        # your e-mail, gets the admin dashboard
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER           # optional: Gmail address for password-reset e-mails
        sync: false
      - key: SMTP_PASSWORD       # optional: Gmail App Password
        sync: false
